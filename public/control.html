<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevControl · Control Center</title>
<style>
:root{color-scheme:dark;--bg:#090d13;--panel:#111923;--line:#273548;--text:#edf4fb;--muted:#8da0b6;--green:#4ade80;--yellow:#fbbf24;--red:#fb7185;--blue:#60a5fa;--cyan:#67e8f9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#16243a 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1640px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--cyan)}h1{margin:5px 0 4px;font-size:32px}.sub{font-size:13px;color:var(--muted);max-width:940px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,.action{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#131d29;color:var(--text);text-decoration:none;cursor:pointer;font:inherit;font-size:12px}.action:hover,.btn:hover{border-color:#46617f}.action.primary{border-color:#2a6686;background:#123044}.action.warn{border-color:#6f5a1f}.action.danger{border-color:#713243}.action:disabled{opacity:.42;cursor:not-allowed}.toolbar{margin:20px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:11px;color:var(--muted);margin-left:auto}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}.stat,.panel{border:1px solid var(--line);background:linear-gradient(180deg,#131c28,#0e151e);border-radius:14px}.stat{padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(370px,.65fr);gap:14px}.panel{overflow:hidden}.panel h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto;max-height:720px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid #1e2a39;vertical-align:top}th{position:sticky;top:0;background:#111923;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;z-index:1}.name{font-weight:800;font-size:13px}.muted{color:var(--muted);font-size:10px;margin-top:3px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 6px;font-size:9px;font-weight:800}.PASS,.SUCCESS,.MANAGED,.QUALIFY,.READY,.ENABLED{color:var(--green);border-color:#28613e}.FAIL,.FAILED,.ERROR,.BLOCKED,.GODOT_UNAVAILABLE,.NEEDS_PROJECT_PATH{color:var(--red);border-color:#713243}.SHADOW,.SKIPPED,.NEEDS_OPT_IN,.RUNNING,.UNTESTED{color:var(--yellow);border-color:#6f5a1f}.OBSERVE,.NOT_APPLICABLE,.OFF{color:var(--blue);border-color:#315b86}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions .action{padding:5px 7px;font-size:10px}.ops{max-height:720px;overflow:auto}.op{padding:12px 14px;border-bottom:1px solid #1e2a39}.ophead{display:flex;justify-content:space-between;gap:10px}.op pre{white-space:pre-wrap;word-break:break-word;background:#080c12;border:1px solid #1d2938;border-radius:8px;padding:9px;font-size:10px;max-height:240px;overflow:auto;color:#c9d6e3}.empty{padding:20px;color:var(--muted)}.error{color:var(--red)}.footer{font-size:10px;color:var(--muted);margin-top:14px}@media(max-width:1120px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{padding:14px}.top{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.note{width:100%;margin:4px 0 0}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><div class="eyebrow">DEVCONTROL · LOCAL CONTROL CENTER</div><h1>管理中心</h1><div class="sub">集中管理本机多项目的发现、同步、验收、Godot Visual Gate、故障归档与修复审查。浏览器只提交固定 action/project；服务端拒绝任意 shell、command 或 argv。</div></div><div class="nav"><a class="btn" href="/">GitHub 看板</a><a class="btn" href="/autonomy.html">自治看板</a></div></div>
<div class="toolbar"><button class="action primary" data-global="discover">发现项目</button><button class="action" data-global="visual_probe">Visual Probe</button><button class="action warn" data-global="sync">同步全部</button><button class="action" data-global="qualify">验收全部</button><button class="action primary" data-global="reconcile">完整 Reconcile</button><button class="action" data-global="failures">Failure Packet</button><button class="action" data-global="repairs">Repair Plan</button><span class="note">localhost-only · AutoFix / Push / PR 创建 / Merge 不提供普通按钮</span></div>
<section id="stats" class="stats"></section>
<div class="layout"><section class="panel"><h2>项目</h2><div class="tablewrap"><table><thead><tr><th>项目</th><th>自治</th><th>Qualification</th><th>Visual</th><th>Known-good</th><th>操作</th></tr></thead><tbody id="projects"></tbody></table></div></section><section class="panel"><h2>本机操作</h2><div id="operations" class="ops"></div></section></div>
<div class="footer" id="updated"></div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=s=>s?String(s).slice(0,10):'—';
const badge=s=>`<span class="badge ${esc(s||'')}">${esc(s||'—')}</span>`;
const stat=(v,k)=>`<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`;
function setBusy(value){document.querySelectorAll('button.action').forEach(b=>b.disabled=value)}
async function json(url,options){const r=await fetch(url,{cache:'no-store',...options});const text=await r.text();let data={};try{data=JSON.parse(text)}catch{data={error:text}}if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
async function invoke(action,project=null,force=false){
 const labels={discover:'发现项目',visual_probe:'Visual Probe',visual_enable:'启用 Visual Gate',visual_disable:'关闭 Visual Gate',visual_status:'Visual Status',visual_run:'Visual Run',sync:'同步',qualify:'验收',reconcile:'完整 Reconcile',failures:'Failure Packet',repairs:'Repair Plan',repair_review:'PR Review',repair_cleanup:'Cleanup'};
 const confirmActions=['sync','reconcile','repair_cleanup','visual_enable','visual_disable','visual_run'];
 if(confirmActions.includes(action)&&!confirm(`确认执行 ${labels[action]||action}${project?' · '+project:''}？\n\n所有操作仍受 DevControl 的 clean-tree / allowlist / known-good / Visual policy 安全门约束。`))return;
 setBusy(true);
 try{await json('/api/local-control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,project,force})});await load()}catch(e){alert(e.message)}finally{setBusy(false)}
}
function visualButtons(p){
 if(!(p.stacks||[]).includes('godot'))return '';
 const registered=p.registration?.state==='REGISTERED';
 const enabled=Boolean(p.registration?.visualQualification?.enabled);
 if(!registered)return `<button class="action" onclick="invoke('visual_probe','${esc(p.key)}')">Probe</button><span class="muted">Visual override 需注册</span>`;
 return `<button class="action" onclick="invoke('visual_probe','${esc(p.key)}')">Probe</button>${enabled?`<button class="action" onclick="invoke('visual_status','${esc(p.key)}')">V.Status</button><button class="action primary" onclick="invoke('visual_run','${esc(p.key)}')">V.Run</button><button class="action danger" onclick="invoke('visual_disable','${esc(p.key)}')">V.Off</button>`:`<button class="action primary" onclick="invoke('visual_enable','${esc(p.key)}')">V.On</button>`}`;
}
function projectRow(p){
 const q=p.latestQualification;const life=p.lifecycle;const v=q?.visualQualification;const visualEnabled=Boolean(p.registration?.visualQualification?.enabled);const visualState=v?.status||(visualEnabled?'ENABLED':'OFF');
 const visualEvidence=v?.evidence?.screenshots?.length!=null?`<div class="muted">frames ${esc(v.evidence.screenshots.length)} · Vulkan ${v.evidence.vulkanEvidence?'yes':'no'} · GPU ${v.evidence.gpuMatched?'yes':'no'}</div>`:'';
 return `<tr><td><div class="name">${esc(p.name||p.key)}</div><div class="muted mono">${esc(p.repo||'')}</div><div class="muted mono">${esc(p.localPath||'')}</div></td><td>${badge(p.autonomy?.level)}</td><td>${badge(q?.status||'UNTESTED')}<div class="muted mono">${esc(short(q?.project?.sha||p.sha))}</div></td><td>${badge(visualState)}<div class="muted">${esc((p.godotProjectPaths||[]).join(', ')||'—')}</div>${visualEvidence}</td><td><span class="mono">${esc(short(life?.knownGoodSha))}</span>${life?.quarantine?`<div class="error">Q: ${esc(short(life.quarantine.sha))}</div>`:''}</td><td><div class="actions">${visualButtons(p)}<button class="action warn" onclick="invoke('sync','${esc(p.key)}')">Sync</button><button class="action" onclick="invoke('qualify','${esc(p.key)}')">Qualify</button><button class="action" onclick="invoke('repair_review','${esc(p.key)}')">Review</button><button class="action" onclick="invoke('repair_cleanup','${esc(p.key)}')">Cleanup</button></div></td></tr>`
}
function opView(o){const output=[o.stdout,o.stderr,o.error].filter(Boolean).join('\n');return `<div class="op"><div class="ophead"><div><b>${esc(o.action)}</b>${o.project?` · ${esc(o.project)}`:''}<div class="muted mono">${esc(o.id)}</div></div>${badge(o.status)}</div><div class="muted">${esc(new Date(o.startedAt).toLocaleString('zh-CN',{hour12:false}))}${o.finishedAt?' → '+esc(new Date(o.finishedAt).toLocaleTimeString('zh-CN',{hour12:false})):''}</div>${output?`<pre>${esc(output)}</pre>`:''}</div>`}
async function load(){
 try{const [state,ops]=await Promise.all([json('/api/local-state'),json('/api/local-operations')]);const ps=Object.values(state.projects||{});const failures=ps.filter(p=>p.latestQualification?.status==='FAIL').length;document.querySelector('#stats').innerHTML=[stat(ps.length,'项目'),stat(state.counts?.qualification?.PASS||0,'PASS'),stat(failures,'FAIL'),stat(state.counts?.visual?.enabled||0,'Visual Gate'),stat(state.failureQueue?.count||0,'Failure Packets'),stat(state.repairPlans?.count||0,'Repair Plans')].join('');document.querySelector('#projects').innerHTML=ps.sort((a,b)=>String(a.key).localeCompare(String(b.key))).map(projectRow).join('')||'<tr><td colspan="6" class="empty">尚未发现项目</td></tr>';document.querySelector('#operations').innerHTML=(ops.operations||[]).map(opView).join('')||'<div class="empty">暂无本机操作</div>';document.querySelector('#updated').textContent='Updated '+new Date(state.generatedAt).toLocaleString('zh-CN',{hour12:false});setBusy((ops.operations||[]).some(o=>o.status==='RUNNING'))}catch(e){document.querySelector('#operations').innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}
document.querySelectorAll('[data-global]').forEach(b=>b.addEventListener('click',()=>invoke(b.dataset.global)));
load();setInterval(load,4000);
</script></body></html>
