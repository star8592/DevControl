<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DevControl · Portfolio Console</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0d12;--panel:#111722;--panel2:#161e2b;--text:#edf3fa;--muted:#8fa0b5;--line:#283447;--green:#4ade80;--yellow:#fbbf24;--red:#fb7185;--blue:#60a5fa;--cyan:#67e8f9}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% -10%,#172033 0,transparent 32%),var(--bg);color:var(--text)}
    a{color:inherit;text-decoration:none}.wrap{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}.title{font-size:34px;font-weight:800;margin:4px 0 5px}.subtitle{color:var(--muted);font-size:14px}.controls{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer}.btn:hover{border-color:#4a617f}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.danger{border-color:#6f2b3a;color:#fecdd3}.stats{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:12px;margin-bottom:18px}.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px}.stat .n{font-size:25px;font-weight:800}.stat .k{font-size:12px;color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:linear-gradient(180deg,#131b27,#0f151e);border:1px solid var(--line);border-radius:17px;padding:18px;min-height:360px}.cardhead{display:flex;justify-content:space-between;gap:14px}.name{font-size:22px;font-weight:800}.repo{font-size:12px;color:var(--muted);margin-top:3px}.badge{height:27px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.05em;border:1px solid}.badge.PASS{color:var(--green);border-color:#245f3a;background:#102519}.badge.RUNNING{color:var(--blue);border-color:#284c75;background:#101f33}.badge.BLOCKED,.badge.ERROR{color:var(--red);border-color:#713243;background:#2a1219}.badge.IDLE{color:var(--yellow);border-color:#705a1d;background:#271f0b}.phase{margin:15px 0 13px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b1119}.phase b{display:block;font-size:14px;margin-bottom:4px}.phase span{color:var(--muted);font-size:12px}.runs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.run{border:1px solid var(--line);border-radius:12px;padding:11px;background:#0c121a}.runlabel{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}.runname{font-size:13px;font-weight:700;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.runmeta{font-size:11px;color:var(--muted);line-height:1.6}.ok{color:var(--green)}.bad{color:var(--red)}.running{color:var(--blue)}.row{display:grid;grid-template-columns:92px 1fr;gap:10px;margin-top:12px;font-size:12px}.label{color:var(--muted)}.value{min-width:0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.small{font-size:11px;padding:8px 10px}.notice{margin:15px 0;padding:11px 13px;border-radius:11px;background:#17140b;border:1px solid #544515;color:#e9d58b;font-size:12px}.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}.empty{color:var(--muted);font-size:12px}.toast{position:fixed;right:24px;bottom:24px;max-width:420px;background:#101722;border:1px solid var(--line);padding:13px 16px;border-radius:12px;box-shadow:0 15px 45px #0008;display:none}.toast.show{display:block}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 #60a5fa88;animation:pulse 1.4s infinite;margin-right:5px}@keyframes pulse{70%{box-shadow:0 0 0 7px #60a5fa00}100%{box-shadow:0 0 0 0 #60a5fa00}}
    @media(max-width:980px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.top{flex-direction:column}}@media(max-width:560px){.wrap{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.runs{grid-template-columns:1fr}.title{font-size:28px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div><div class="eyebrow">Local-first development control plane</div><div class="title">DevControl</div><div class="subtitle">DaoLife · BISRE · CrossAlpha · Tidebound — GitHub 作为控制面，本地 self-hosted 作为重任务验收权威。</div></div>
      <div class="controls"><span id="clock" class="subtitle"></span><button id="refresh" class="btn">立即刷新</button></div>
    </div>
    <div id="tokenNotice" class="notice" style="display:none">当前未配置 GITHUB_TOKEN。公开仓库仍可读取；私有仓库和控制动作需要在启动服务前设置 token。</div>
    <section id="stats" class="stats"></section>
    <section id="grid" class="grid"><div class="empty">正在读取四个项目状态……</div></section>
    <div class="footer"><span>自动刷新：15 秒 · 控制动作：仅开放可逆的失败任务重跑</span><span id="updated"></span></div>
  </main>
  <div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let snapshot=null, refreshing=false;
function fmt(ts){if(!ts)return '—';try{return new Date(ts).toLocaleString('zh-CN',{hour12:false})}catch{return ts}}
function shortSha(sha){return sha?sha.slice(0,9):'—'}
function runClass(run){if(!run)return '';if(run.status==='in_progress'||run.status==='queued')return 'running';if(run.conclusion==='success')return 'ok';if(run.conclusion)return 'bad';return ''}
function statusText(run){if(!run)return '未发现';if(run.status==='in_progress')return 'RUNNING';if(run.status==='queued')return 'QUEUED';return (run.conclusion||run.status||'UNKNOWN').toUpperCase()}
function runBox(label,run){if(!run)return `<div class="run"><div class="runlabel">${label}</div><div class="runname empty">最近记录未发现</div></div>`;return `<div class="run"><div class="runlabel">${label}</div><a target="_blank" rel="noreferrer" href="${esc(run.url)}"><div class="runname">${esc(run.name)}</div></a><div class="runmeta"><span class="${runClass(run)}">${run.status==='in_progress'?'<span class="pulse"></span>':''}${esc(statusText(run))}</span><br>${esc(run.branch||'—')} · <span class="mono">${esc(shortSha(run.sha))}</span><br>${esc(fmt(run.updatedAt))}</div></div>`}
function projectCard(p){const failed=[p.localRun,p.lightRun,p.latestRun].find(r=>r&&['failure','timed_out','cancelled','action_required'].includes(r.conclusion));const issue=p.issue?`<a target="_blank" rel="noreferrer" href="${esc(p.issue.url)}">#${p.issue.number} ${esc(p.issue.title)}</a>`:'未发现 Dashboard issue';const prs=(p.pullRequests||[]).slice(0,3).map(pr=>`<a target="_blank" rel="noreferrer" href="${esc(pr.url)}">#${pr.number}${pr.draft?' Draft':''}: ${esc(pr.title)}</a>`).join('<br>')||'无开放 PR';return `<article class="card"><div class="cardhead"><div><div class="name">${esc(p.name)}</div><div class="repo">${esc(p.repo)}</div></div><div class="badge ${esc(p.state)}">${esc(p.state)}</div></div><div class="phase"><b>${esc(p.phase)}</b><span>Next → ${esc(p.nextAction)}</span></div><div class="runs">${runBox('LIGHT / WEB CI',p.lightRun)}${runBox('SELF-HOSTED AUTHORITY',p.localRun)}</div><div class="row"><div class="label">Blocker</div><div class="value ${p.blocker?'bad':''}">${esc(p.blocker||'无已知 blocker')}</div></div><div class="row"><div class="label">Runner</div><div class="value">可见 ${p.runnerSummary?.visible??0} · 在线 ${p.runnerSummary?.online??0} · 忙碌 ${p.runnerSummary?.busy??0}</div></div><div class="row"><div class="label">Dashboard</div><div class="value">${issue}</div></div><div class="row"><div class="label">Open PR</div><div class="value">${prs}</div></div><div class="row"><div class="label">Safety</div><div class="value">${esc(p.safety)}</div></div><div class="actions"><button class="btn small" onclick="refreshNow()">刷新状态</button>${p.issue?`<a class="btn small" target="_blank" rel="noreferrer" href="${esc(p.issue.url)}">打开 Dashboard</a>`:''}${p.latestRun?.url?`<a class="btn small" target="_blank" rel="noreferrer" href="${esc(p.latestRun.url)}">最新 Actions</a>`:''}${failed?`<button class="btn small danger" onclick="rerunFailed('${esc(p.key)}',${failed.id})">重跑失败任务</button>`:''}</div></article>`}
function render(data){snapshot=data;$('#tokenNotice').style.display=data.tokenConfigured?'none':'block';const c=data.counts||{};const total=(data.projects||[]).length;$('#stats').innerHTML=[['项目',total],['运行中',c.RUNNING||0],['通过',c.PASS||0],['阻塞',c.BLOCKED||0],['Runner 在线',data.runners?.online||0],['Runner 忙碌',data.runners?.busy||0]].map(([k,n])=>`<div class="stat"><div class="n">${n}</div><div class="k">${k}</div></div>`).join('');$('#grid').innerHTML=(data.projects||[]).map(projectCard).join('');$('#updated').textContent=`最后刷新 ${fmt(data.generatedAt)}`}
function toast(msg,bad=false){const t=$('#toast');t.textContent=msg;t.style.borderColor=bad?'#713243':'#283447';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4000)}
async function load(){if(refreshing)return;refreshing=true;$('#refresh').disabled=true;try{const r=await fetch('/api/status',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);render(d)}catch(e){toast(`刷新失败：${e.message}`,true)}finally{refreshing=false;$('#refresh').disabled=false}}
async function rerunFailed(project,runId){if(!confirm(`确认重新运行 ${project} 的失败任务 ${runId}？`))return;try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project,action:'rerun_failed',runId})});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);toast(`已提交重跑：${project} / ${runId}`);setTimeout(load,1200)}catch(e){toast(`控制失败：${e.message}`,true)}}
window.refreshNow=load;window.rerunFailed=rerunFailed;$('#refresh').addEventListener('click',load);setInterval(load,15000);setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false}),1000);load();
</script>
</body>
</html>
