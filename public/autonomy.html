<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevControl · Autonomous Development</title>
<style>
:root{color-scheme:dark;--bg:#090d13;--panel:#111923;--line:#273548;--text:#edf4fb;--muted:#8da0b6;--green:#4ade80;--yellow:#fbbf24;--red:#fb7185;--blue:#60a5fa;--cyan:#67e8f9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#16243a 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--cyan)}h1{margin:5px 0 4px;font-size:32px}.sub{color:var(--muted);font-size:13px}.btn{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);text-decoration:none;background:#131d29}.stats{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin:20px 0}.stat,.card{border:1px solid var(--line);background:linear-gradient(180deg,#131c28,#0e151e);border-radius:14px}.stat{padding:13px}.stat b{font-size:24px}.stat span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:16px}.head{display:flex;justify-content:space-between;gap:14px}.name{font-size:20px;font-weight:800}.repo,.path{color:var(--muted);font-size:11px;margin-top:4px;overflow-wrap:anywhere}.badge{border:1px solid;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;height:max-content}.MANAGED,.QUALIFY,.PASS,.CANDIDATE_READY,.BRANCH_READY,.PR_READY{color:var(--green);border-color:#28613e}.SHADOW,.UNTESTED,.SKIPPED,.LOCAL_ONLY{color:var(--yellow);border-color:#6f5a1f}.OBSERVE{color:var(--blue);border-color:#315b86}.BLOCKED,.FAIL,.ERROR,.PUSH_FAILED,.VALIDATION_FAILED{color:var(--red);border-color:#713243}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.tag{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:3px 6px;border-radius:999px}.rows{display:grid;grid-template-columns:120px 1fr;gap:7px 10px;margin-top:12px;font-size:12px}.label{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--yellow)}.queue{margin-top:20px}.item{border-bottom:1px solid var(--line);padding:9px 0;font-size:12px}.empty{color:var(--muted)}.footer{color:var(--muted);font-size:11px;margin-top:18px}.prlink{color:var(--cyan)}
@media(max-width:1200px){.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:1000px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.top{flex-direction:column}.rows{grid-template-columns:90px 1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div><div class="eyebrow">DEVCONTROL · AUTONOMOUS DEVELOPMENT PLANE</div><h1>Autonomy Dashboard</h1><div class="sub">自动发现 → 安全同步 → 本机验收 → Playbook 学习 → 隔离/回滚 → AI Failure → Repair Plan → Isolated AutoFix → Repair Candidate / Draft PR</div></div><div><a class="btn" href="/">主看板</a> <a class="btn" href="/api/status">GitHub 状态 API</a></div></div>
<section id="stats" class="stats"></section>
<section id="grid" class="grid"><div class="empty">正在读取本机自治状态…</div></section>
<section class="queue"><h2>Repair Candidates</h2><div id="candidates"></div></section>
<section class="queue"><h2>AI Failure Queue</h2><div id="failures"></div></section>
<div class="footer"><span id="updated"></span> · 每 10 秒自动刷新 · 数据由 DevControl reconcile 生成</div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=s=>s?String(s).slice(0,10):'—';
function stat(n,k){return `<div class="stat"><b>${esc(n)}</b><span>${esc(k)}</span></div>`}
function row(k,v,cls=''){return `<div class="label">${esc(k)}</div><div class="${cls}">${v}</div>`}
function candidateText(candidate){if(!candidate)return'—';const status=`<span class="badge ${esc(candidate.status||'')}">${esc(candidate.status||'—')}</span>`;const pr=candidate.pr?.url?` · <a class="prlink" target="_blank" rel="noreferrer" href="${esc(candidate.pr.url)}">Draft PR #${esc(candidate.pr.number)}</a>`:'';return `${status}${pr}<br><span class="mono">${esc(candidate.branch||'')}</span>`}
function card(p){
 const q=p.latestQualification;const life=p.lifecycle;const play=p.playbook;const level=p.autonomy?.level||'UNKNOWN';const qs=q?.status||'UNTESTED';const quarantine=life?.quarantine;const repair=p.latestRepairPlan;const attempt=p.latestRepairAttempt;const candidate=p.latestRepairCandidate;
 return `<article class="card"><div class="head"><div><div class="name">${esc(p.name||p.key)}</div><div class="repo">${esc(p.repo||'no GitHub remote')}</div><div class="path mono">${esc(p.localPath||'—')}</div></div><div><div class="badge ${esc(level)}">${esc(level)}</div><div style="height:6px"></div><div class="badge ${esc(qs)}">${esc(qs)}</div></div></div><div class="tags">${(p.stacks||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="rows">${row('Current SHA',`<span class="mono">${esc(short(p.sha))}</span>${p.dirty?' <span class="warn">DIRTY</span>':''}`)}${row('Known-good',`<span class="mono good">${esc(short(life?.knownGoodSha))}</span>`)}${row('Sync',esc(life?.lastSyncStatus||'—'))}${row('Quarantine',quarantine?`<span class="bad mono">${esc(short(quarantine.sha))}</span> · ${esc(quarantine.reason||'')}`:'无')}${row('Qualification',q?`${esc(q.status)} · ${esc(q.runId||'')}`:'未执行')}${row('Pass rate',play?.runPassRate!=null?`${Math.round(play.runPassRate*100)}% · ${esc(play.observations)} runs`:'暂无历史')}${row('AI packets',String(p.failurePackets||0),p.failurePackets?'bad':'')}${row('Repair plan',repair?`${esc(repair.provider||'plan')} · ${Math.round((repair.confidence||0)*100)}%<br>${esc(repair.summary||'')}`:'—')}${row('AutoFix',attempt?`<span class="badge ${esc(attempt.status||'')}">${esc(attempt.status||'—')}</span><br><span class="mono">${esc(short(attempt.repairSha))}</span>`:'—')}${row('Candidate',candidateText(candidate))}${row('Safe commands',(p.autonomy?.safeCommands||[]).map(x=>`<div class="mono">${esc(x)}</div>`).join('')||'—')}</div></article>`
}
async function load(){
 try{
  const r=await fetch('/autonomy-data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();
  const a=d.counts?.autonomy||{},q=d.counts?.qualification||{};
  document.querySelector('#stats').innerHTML=[stat(d.counts?.total||0,'发现项目'),stat(a.MANAGED||0,'MANAGED'),stat(a.QUALIFY||0,'QUALIFY'),stat(q.PASS||0,'最近 PASS'),stat(d.failureQueue?.count||0,'AI Failure'),stat(d.repairPlans?.count||0,'Repair Plans'),stat(d.repairAttempts?.count||0,'AutoFix Attempts'),stat(d.repairCandidates?.count||0,'Repair Candidates')].join('');
  document.querySelector('#grid').innerHTML=Object.values(d.projects||{}).sort((x,y)=>String(x.key).localeCompare(String(y.key))).map(card).join('')||'<div class="empty">尚未发现项目</div>';
  document.querySelector('#candidates').innerHTML=(d.repairCandidates?.items||[]).slice(0,20).map(c=>`<div class="item"><b>${esc(c.project)}</b> · <span class="badge ${esc(c.status||'')}">${esc(c.status||'—')}</span> · <span class="mono">${esc(short(c.repairSha))}</span>${c.pr?.url?` · <a class="prlink" target="_blank" rel="noreferrer" href="${esc(c.pr.url)}">Draft PR #${esc(c.pr.number)}</a>`:''}<br><span class="mono">${esc(c.branch||'')}</span></div>`).join('')||'<div class="empty">当前没有已发布 Repair Candidate</div>';
  document.querySelector('#failures').innerHTML=(d.failureQueue?.items||[]).slice(0,20).map(f=>`<div class="item"><b>${esc(f.project)}</b> · <span class="mono">${esc(short(f.sha))}</span> · ${esc((f.categories||[]).join(', '))}<br><span class="mono">${esc(f.failedCommand||'')}</span></div>`).join('')||'<div class="empty">当前没有失败包</div>';
  document.querySelector('#updated').textContent='Updated '+new Date(d.generatedAt).toLocaleString('zh-CN',{hour12:false});
 }catch(e){document.querySelector('#grid').innerHTML=`<div class="bad">无法读取 autonomy-data.json：${esc(e.message)}</div>`}
}
load();setInterval(load,10000);
</script>
</body>
</html>
