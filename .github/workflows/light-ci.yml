name: DevControl Light CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: npm run check
      - name: Health smoke
        run: |
          node server.mjs > /tmp/devcontrol.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/devcontrol.log
          exit 1
