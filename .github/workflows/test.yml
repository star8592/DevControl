name: DevControl CI

on:
  push:
    branches:
      - main
      - feat/mcp-bridge-v030
  pull_request:

jobs:
  rust-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release
